<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF1F2"/>
    </linearGradient>
    <linearGradient id="champagne" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="roseAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="60%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#E11D48" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Squircle Base with Soft Glow -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#FECDD3" stroke-width="4" filter="url(#softShadow)"/>

  <!-- Sparkle Rays Above Contact Point -->
  <path d="M 256 122 L 256 94" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
  <path d="M 234 134 L 216 116" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
  <path d="M 278 134 L 296 116" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
  <circle cx="210" cy="184" r="3.5" fill="#F59E0B"/>
  <circle cx="302" cy="184" r="3.5" fill="#F59E0B"/>

  <!-- Glowing Heart at Clink -->
  <path d="M 256 155 C 256 150, 246 138, 238 138 C 230 138, 224 144, 224 152 C 224 162, 238 174, 256 186 C 274 174, 288 162, 288 152 C 288 144, 282 138, 274 138 C 266 138, 256 150, 256 155 Z" fill="url(#roseAccent)"/>

  <!-- Left Champagne Glass -->
  <g transform="rotate(14 215 280)">
    <!-- Champagne liquid -->
    <path d="M 188 185 Q 212 280 212 280 Q 212 280 236 185 Z" fill="url(#champagne)"/>
    <!-- Liquid bubbles -->
    <circle cx="206" cy="235" r="3" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="218" cy="210" r="2.5" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="202" cy="260" r="2" fill="#FFFFFF" opacity="0.6"/>
    <!-- Glass bowl outline -->
    <path d="M 180 160 L 188 185 Q 212 295 212 295 Q 212 295 236 185 L 244 160 Z" fill="none" stroke="url(#roseAccent)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Stem -->
    <path d="M 212 295 L 212 375" stroke="url(#roseAccent)" stroke-width="9" stroke-linecap="round"/>
    <!-- Base -->
    <path d="M 175 375 L 249 375" stroke="url(#roseAccent)" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- Right Champagne Glass -->
  <g transform="rotate(-14 297 280)">
    <!-- Champagne liquid -->
    <path d="M 276 185 Q 300 280 300 280 Q 300 280 324 185 Z" fill="url(#champagne)"/>
    <!-- Liquid bubbles -->
    <circle cx="294" cy="235" r="3" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="306" cy="210" r="2.5" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="290" cy="260" r="2" fill="#FFFFFF" opacity="0.6"/>
    <!-- Glass bowl outline -->
    <path d="M 268 160 L 276 185 Q 300 295 300 295 Q 300 295 324 185 L 332 160 Z" fill="none" stroke="url(#roseAccent)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Stem -->
    <path d="M 300 295 L 300 375" stroke="url(#roseAccent)" stroke-width="9" stroke-linecap="round"/>
    <!-- Base -->
    <path d="M 263 375 L 337 375" stroke="url(#roseAccent)" stroke-width="9" stroke-linecap="round"/>
  </g>
</svg>
